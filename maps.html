  }

  /* Legend styling */

    background: white !important;
    padding: 10px;
    border-radius: 8px;
  }
</style>

<!-- Main map code from original export -->
<script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: '#ffff00',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: '#ffff00',
                fillOpacity: 1
              });
            }
            highlightLayer.openPopup();
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-7.291161207715245,110.02747617925894],[-6.6075097060992185,111.29808668311946]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var title = new L.Control({'position':'topright'});
        title.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info');
            this.update();
            return this._div;
        };
        title.update = function () {
            this._div.innerHTML = '<h2>Peta Persebaran Penduduk Kabupaten Demak</h2>';
        };
        title.addTo(map);
        var abstract = new L.Control({'position':'topright'});
        abstract.onAdd = function (map) {
            this._div = L.DomUtil.create('div',
            'leaflet-control abstract');
            this._div.id = 'abstract'
                this._div.setAttribute("onmouseenter", "abstract.show()");
                this._div.setAttribute("onmouseleave", "abstract.hide()");
                this.hide();
                return this._div;
            };
            abstract.hide = function () {
                this._div.classList.remove("abstractUncollapsed");
                this._div.classList.add("abstract");
                this._div.innerHTML = 'i'
            }
            abstract.show = function () {
                this._div.classList.remove("abstract");
                this._div.classList.add("abstractUncollapsed");
                this._div.innerHTML = 'Peta ini memberikan informasi jumlah penduduk, kepadatan penduduk, dan laju pertumbuhan penduduk di Kabupaten Demak. Sumber data diperoleh dari Kabupaten Demak Dalam Angka yang diterbitkan Badan Pusat Statistik Kabupaten Demak pada tahun 2025. ';
        };
        abstract.addTo(map);
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_OSMStandard_0');
        map.getPane('pane_OSMStandard_0').style.zIndex = 400;
        var layer_OSMStandard_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OSMStandard_0',
            opacity: 1.0,
            attribution: '<a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors, CC-BY-SA</a>',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        layer_OSMStandard_0;
        map.addLayer(layer_OSMStandard_0);
        function pop_PersebaranPendudukKabupatenDemak_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                    if (typeof layer.closePopup == 'function') {
                        layer.closePopup();
                    } else {
                        layer.eachLayer(function(feature){
                            feature.closePopup()
                        });
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Kecamatan</th>\
                        <td>' + (feature.properties['Kecamatan'] !== null ? autolinker.link(String(feature.properties['Kecamatan']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Laju Pertumbuhan Penduduk (% per tahun)</th>\
                        <td>' + (feature.properties['Laju Pertu'] !== null ? autolinker.link(String(feature.properties['Laju Pertu']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Kepadatan Penduduk (per km²)</th>\
                        <td>' + (feature.properties['Kepadatan '] !== null ? autolinker.link(String(feature.properties['Kepadatan ']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Jumlah Penduduk (ribu)</th>\
                        <td>' + (feature.properties['Jumlah Pen'] !== null ? autolinker.link(String(feature.properties['Jumlah Pen']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_PersebaranPendudukKabupatenDemak_1_0(feature) {
            if (feature.properties['Jumlah Pen'] >= 43000.000000 && feature.properties['Jumlah Pen'] <= 75666.666667 ) {
                return {
                pane: 'pane_PersebaranPendudukKabupatenDemak_1',
                opacity: 1,
                color: 'rgba(56,128,54,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(241,238,246,1.0)',
                interactive: true,
            }
            }
            if (feature.properties['Jumlah Pen'] >= 75666.666667 && feature.properties['Jumlah Pen'] <= 97333.333333 ) {
                return {
                pane: 'pane_PersebaranPendudukKabupatenDemak_1',
                opacity: 1,
                color: 'rgba(56,128,54,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(116,169,207,1.0)',
                interactive: true,
            }
            }
            if (feature.properties['Jumlah Pen'] >= 97333.333333 && feature.properties['Jumlah Pen'] <= 183000.000000 ) {
                return {
                pane: 'pane_PersebaranPendudukKabupatenDemak_1',
                opacity: 1,
                color: 'rgba(56,128,54,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(4,90,141,1.0)',
                interactive: true,
            }
            }
        }
        map.createPane('pane_PersebaranPendudukKabupatenDemak_1');
        map.getPane('pane_PersebaranPendudukKabupatenDemak_1').style.zIndex = 401;
        map.getPane('pane_PersebaranPendudukKabupatenDemak_1').style['mix-blend-mode'] = 'normal';
        var layer_PersebaranPendudukKabupatenDemak_1 = new L.geoJson(json_PersebaranPendudukKabupatenDemak_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_PersebaranPendudukKabupatenDemak_1',
            layerName: 'layer_PersebaranPendudukKabupatenDemak_1',
            pane: 'pane_PersebaranPendudukKabupatenDemak_1',
            onEachFeature: pop_PersebaranPendudukKabupatenDemak_1,
            style: style_PersebaranPendudukKabupatenDemak_1_0,
        });
        bounds_group.addLayer(layer_PersebaranPendudukKabupatenDemak_1);
        map.addLayer(layer_PersebaranPendudukKabupatenDemak_1);
        var overlaysTree = [
            {label: 'Persebaran Penduduk Kabupaten Demak<br /><table><tr><td style="text-align: center;"><img src="legend/PersebaranPendudukKabupatenDemak_1_Rendah4375ribu0.png" /></td><td>Rendah (43-75 ribu)</td></tr><tr><td style="text-align: center;"><img src="legend/PersebaranPendudukKabupatenDemak_1_Sedang7597ribu1.png" /></td><td>Sedang (75-97 ribu)</td></tr><tr><td style="text-align: center;"><img src="legend/PersebaranPendudukKabupatenDemak_1_Tinggi97183ribu2.png" /></td><td>Tinggi (97-183 ribu)</td></tr></table>', layer: layer_PersebaranPendudukKabupatenDemak_1},
            {label: "OSM Standard", layer: layer_OSMStandard_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
   
</script>
